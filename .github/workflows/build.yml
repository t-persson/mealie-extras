name: Build binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build binaries
        run: make build

      - name: Package release assets
        run: |
          mkdir -p dist
          tar -C bin -czf dist/mealie-extras-linux-amd64.tar.gz \
            mealie-generate mealie-shoppinglist mealie-freezer mealie-pantry
          sha256sum dist/mealie-extras-linux-amd64.tar.gz > dist/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mealie-extras-linux-amd64-${{ github.sha }}
          path: |
            bin/mealie-generate
            bin/mealie-shoppinglist
            bin/mealie-freezer
            bin/mealie-pantry
            dist/*
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: mealie-extras-linux-amd64-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/dist/*
